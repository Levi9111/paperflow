name: Frontend Web CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: TypeScript Check & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: app_shell/pnpm-lock.yaml
      - name: Install Dependencies
        run: cd app_shell && pnpm install
      - name: Type Check & Build
        run: cd app_shell && pnpm build
